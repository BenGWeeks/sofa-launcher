name: Release
on:
  push:
    tags: ['v*.*.*']
permissions: {}
jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      # TODO: pin actions/checkout to a reviewed full commit SHA.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # TODO: pin actions/setup-node to a reviewed full commit SHA.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const v = require("./package.json").version; if (process.env.RELEASE_TAG !== `v${v}`) { console.error("Tag must match package.json version", v); process.exit(1); }'
      - run: npm ci
      - run: npm run check
      - name: Build Debian package
        run: |
          umask 022
          npm run dist:deb
      - name: Generate checksums
        working-directory: release
        run: sha256sum -- *.deb > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: debian-release
          path: |
            release/*.deb
            release/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: debian-release
          path: release
      - name: Generate release notes
        working-directory: release
        run: |
          {
            echo 'Install as an administrator using the reviewed /usr/local/sbin/sofa-install script.'
            echo
            echo 'SHA256:'
            echo '```text'
            cat SHA256SUMS
            echo '```'
            echo
            echo '```bash'
            while read -r checksum filename; do
              printf 'sudo sofa-install %s %s\n' "$filename" "$checksum"
            done < SHA256SUMS
            echo '```'
          } > release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release/*.deb release/SHA256SUMS --verify-tag --title "Sofa Launcher $RELEASE_TAG" --notes-file release/release-notes.md
